[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h2multisim"
version = "1.1.0"
description = "Multi-scale pure-Python simulation toolkit for underground hydrogen storage (UHS)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Ziad Bennour", email = "zbennour@yahoo.com" },
    { name = "Kushan Sandunil" },
]
keywords = [
    "hydrogen",
    "subsurface",
    "storage",
    "reservoir-simulation",
    "thermodynamics",
    "finite-volume",
    "multi-scale",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zbennour/H2MultiSim"
Repository = "https://github.com/zbennour/H2MultiSim"
Issues = "https://github.com/zbennour/H2MultiSim/issues"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
yaml = [
    "pyyaml>=6.0",
]

[project.scripts]
h2multisim = "h2multisim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/h2multisim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    "h2_*.py",
    "legacy",
    "audit",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]
